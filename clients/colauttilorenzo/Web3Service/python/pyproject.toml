[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arc56-generated-colau_0399f110"
version = "1.2.2026102411"
description = "Generated ARC-56 Algorand smart-contract clients for colauttilorenzo/Web3Service."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "colauttilorenzo" }]
keywords = ["algorand", "arc56", "avm", "smart-contract", "generated-client", "colauttilorenzo", "Web3Service"]
dependencies = [
    "algokit-utils>=4.2.3,<5.0.0",
    "py-algorand-sdk>=2.11.1,<3.0.0",
]

[project.urls]
Homepage = "https://github.com/scholtz/Arc56Registry"
Repository = "https://github.com/scholtz/Arc56Registry"

[tool.hatch.build.targets.wheel]
packages = ["src/arc56_generated_colau_0399f110"]
