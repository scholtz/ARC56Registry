[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arc56-generated-m1o1-_1d7dd1e3"
version = "1.1.2026080109"
description = "Generated ARC-56 Algorand smart-contract clients for m1o1/building-on-algo."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "m1o1" }]
keywords = ["algorand", "arc56", "avm", "smart-contract", "generated-client", "m1o1", "building-on-algo"]
dependencies = [
    "algokit-utils>=4.2.3,<5.0.0",
    "py-algorand-sdk>=2.11.1,<3.0.0",
]

[project.urls]
Homepage = "https://github.com/scholtz/Arc56Registry"
Repository = "https://github.com/scholtz/Arc56Registry"

[tool.hatch.build.targets.wheel]
packages = ["src/arc56_generated_m1o1__1d7dd1e3"]
