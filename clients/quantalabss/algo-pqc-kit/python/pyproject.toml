[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arc56-generated-quant_5b3dd6f2"
version = "1.1.2026081507"
description = "Generated ARC-56 Algorand smart-contract clients for quantalabss/algo-pqc-kit."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "quantalabss" }]
keywords = ["algorand", "arc56", "avm", "smart-contract", "generated-client", "quantalabss", "algo-pqc-kit"]
dependencies = [
    "algokit-utils>=4.2.3,<5.0.0",
    "py-algorand-sdk>=2.11.1,<3.0.0",
]

[project.urls]
Homepage = "https://github.com/scholtz/Arc56Registry"
Repository = "https://github.com/scholtz/Arc56Registry"

[tool.hatch.build.targets.wheel]
packages = ["src/arc56_generated_quant_5b3dd6f2"]
