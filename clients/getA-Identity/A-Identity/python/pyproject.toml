[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arc56-generated-geta-_70f59d53"
version = "1.1.2026083012"
description = "Generated ARC-56 Algorand smart-contract clients for getA-Identity/A-Identity."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "getA-Identity" }]
keywords = ["algorand", "arc56", "avm", "smart-contract", "generated-client", "getA-Identity", "A-Identity"]
dependencies = [
    "algokit-utils>=4.2.3,<5.0.0",
    "py-algorand-sdk>=2.11.1,<3.0.0",
]

[project.urls]
Homepage = "https://github.com/scholtz/Arc56Registry"
Repository = "https://github.com/scholtz/Arc56Registry"

[tool.hatch.build.targets.wheel]
packages = ["src/arc56_generated_geta__70f59d53"]
