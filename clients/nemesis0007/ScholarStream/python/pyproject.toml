[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arc56-generated-nemes_7d247fd6"
version = "1.1.2026111716"
description = "Generated ARC-56 Algorand smart-contract clients for nemesis0007/ScholarStream."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "nemesis0007" }]
keywords = ["algorand", "arc56", "avm", "smart-contract", "generated-client", "nemesis0007", "ScholarStream"]
dependencies = [
    "algokit-utils>=4.2.3,<5.0.0",
    "py-algorand-sdk>=2.11.1,<3.0.0",
]

[project.urls]
Homepage = "https://github.com/scholtz/Arc56Registry"
Repository = "https://github.com/scholtz/Arc56Registry"

[tool.hatch.build.targets.wheel]
packages = ["src/arc56_generated_nemes_7d247fd6"]
