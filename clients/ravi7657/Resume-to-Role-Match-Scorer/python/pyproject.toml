[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arc56-generated-ravi7_d898f498"
version = "1.1.2026081408"
description = "Generated ARC-56 Algorand smart-contract clients for ravi7657/Resume-to-Role-Match-Scorer."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "ravi7657" }]
keywords = ["algorand", "arc56", "avm", "smart-contract", "generated-client", "ravi7657", "Resume-to-Role-Match-Scorer"]
dependencies = [
    "algokit-utils>=4.2.3,<5.0.0",
    "py-algorand-sdk>=2.11.1,<3.0.0",
]

[project.urls]
Homepage = "https://github.com/scholtz/Arc56Registry"
Repository = "https://github.com/scholtz/Arc56Registry"

[tool.hatch.build.targets.wheel]
packages = ["src/arc56_generated_ravi7_d898f498"]
