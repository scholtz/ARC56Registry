[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arc56-generated-ranji_00806f53"
version = "1.1.2026081408"
description = "Generated ARC-56 Algorand smart-contract clients for ranjith-ind/Evidence-Chain."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "ranjith-ind" }]
keywords = ["algorand", "arc56", "avm", "smart-contract", "generated-client", "ranjith-ind", "Evidence-Chain"]
dependencies = [
    "algokit-utils>=4.2.3,<5.0.0",
    "py-algorand-sdk>=2.11.1,<3.0.0",
]

[project.urls]
Homepage = "https://github.com/scholtz/Arc56Registry"
Repository = "https://github.com/scholtz/Arc56Registry"

[tool.hatch.build.targets.wheel]
packages = ["src/arc56_generated_ranji_00806f53"]
