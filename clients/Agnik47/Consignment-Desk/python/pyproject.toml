[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arc56-generated-agnik_a49f1b54"
version = "1.1.2026082307"
description = "Generated ARC-56 Algorand smart-contract clients for Agnik47/Consignment-Desk."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Agnik47" }]
keywords = ["algorand", "arc56", "avm", "smart-contract", "generated-client", "Agnik47", "Consignment-Desk"]
dependencies = [
    "algokit-utils>=4.2.3,<5.0.0",
    "py-algorand-sdk>=2.11.1,<3.0.0",
]

[project.urls]
Homepage = "https://github.com/scholtz/Arc56Registry"
Repository = "https://github.com/scholtz/Arc56Registry"

[tool.hatch.build.targets.wheel]
packages = ["src/arc56_generated_agnik_a49f1b54"]
