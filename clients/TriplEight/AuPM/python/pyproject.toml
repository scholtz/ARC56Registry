[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arc56-generated-tripl_b5f30855"
version = "1.2.2026093013"
description = "Generated ARC-56 Algorand smart-contract clients for TriplEight/AuPM."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "TriplEight" }]
keywords = ["algorand", "arc56", "avm", "smart-contract", "generated-client", "TriplEight", "AuPM"]
dependencies = [
    "algokit-utils>=4.2.3,<5.0.0",
    "py-algorand-sdk>=2.11.1,<3.0.0",
]

[project.urls]
Homepage = "https://github.com/scholtz/Arc56Registry"
Repository = "https://github.com/scholtz/Arc56Registry"

[tool.hatch.build.targets.wheel]
packages = ["src/arc56_generated_tripl_b5f30855"]
