[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arc56-generated-ameen_fc4e85cb"
version = "1.1.2026110314"
description = "Generated ARC-56 Algorand smart-contract clients for ameenmakestuffs/Algorand-Carpool."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "ameenmakestuffs" }]
keywords = ["algorand", "arc56", "avm", "smart-contract", "generated-client", "ameenmakestuffs", "Algorand-Carpool"]
dependencies = [
    "algokit-utils>=4.2.3,<5.0.0",
    "py-algorand-sdk>=2.11.1,<3.0.0",
]

[project.urls]
Homepage = "https://github.com/scholtz/Arc56Registry"
Repository = "https://github.com/scholtz/Arc56Registry"

[tool.hatch.build.targets.wheel]
packages = ["src/arc56_generated_ameen_fc4e85cb"]
