[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arc56-generated-shash_ec03d311"
version = "1.1.2026101812"
description = "Generated ARC-56 Algorand smart-contract clients for shashank6-alt/Vaarush."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "shashank6-alt" }]
keywords = ["algorand", "arc56", "avm", "smart-contract", "generated-client", "shashank6-alt", "Vaarush"]
dependencies = [
    "algokit-utils>=4.2.3,<5.0.0",
    "py-algorand-sdk>=2.11.1,<3.0.0",
]

[project.urls]
Homepage = "https://github.com/scholtz/Arc56Registry"
Repository = "https://github.com/scholtz/Arc56Registry"

[tool.hatch.build.targets.wheel]
packages = ["src/arc56_generated_shash_ec03d311"]
