[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arc56-generated-marsh_b2871e27"
version = "1.1.2026101512"
description = "Generated ARC-56 Algorand smart-contract clients for Marshal-AM/x500-algorand."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Marshal-AM" }]
keywords = ["algorand", "arc56", "avm", "smart-contract", "generated-client", "Marshal-AM", "x500-algorand"]
dependencies = [
    "algokit-utils>=4.2.3,<5.0.0",
    "py-algorand-sdk>=2.11.1,<3.0.0",
]

[project.urls]
Homepage = "https://github.com/scholtz/Arc56Registry"
Repository = "https://github.com/scholtz/Arc56Registry"

[tool.hatch.build.targets.wheel]
packages = ["src/arc56_generated_marsh_b2871e27"]
