[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arc56-generated-sambh_b2a60dc7"
version = "1.1.2026101612"
description = "Generated ARC-56 Algorand smart-contract clients for sambhavverma2004/aircargo-provenance."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "sambhavverma2004" }]
keywords = ["algorand", "arc56", "avm", "smart-contract", "generated-client", "sambhavverma2004", "aircargo-provenance"]
dependencies = [
    "algokit-utils>=4.2.3,<5.0.0",
    "py-algorand-sdk>=2.11.1,<3.0.0",
]

[project.urls]
Homepage = "https://github.com/scholtz/Arc56Registry"
Repository = "https://github.com/scholtz/Arc56Registry"

[tool.hatch.build.targets.wheel]
packages = ["src/arc56_generated_sambh_b2a60dc7"]
