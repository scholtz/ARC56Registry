[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arc56-generated-syamk_1cc7bb7d"
version = "1.1.2026081607"
description = "Generated ARC-56 Algorand smart-contract clients for SyamKumar2005/RESUME."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "SyamKumar2005" }]
keywords = ["algorand", "arc56", "avm", "smart-contract", "generated-client", "SyamKumar2005", "RESUME"]
dependencies = [
    "algokit-utils>=4.2.3,<5.0.0",
    "py-algorand-sdk>=2.11.1,<3.0.0",
]

[project.urls]
Homepage = "https://github.com/scholtz/Arc56Registry"
Repository = "https://github.com/scholtz/Arc56Registry"

[tool.hatch.build.targets.wheel]
packages = ["src/arc56_generated_syamk_1cc7bb7d"]
