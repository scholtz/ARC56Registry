[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arc56-generated-bdutt_f32c3c6e"
version = "1.1.2026112517"
description = "Generated ARC-56 Algorand smart-contract clients for BDutta18/AlgoWagers."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "BDutta18" }]
keywords = ["algorand", "arc56", "avm", "smart-contract", "generated-client", "BDutta18", "AlgoWagers"]
dependencies = [
    "algokit-utils>=4.2.3,<5.0.0",
    "py-algorand-sdk>=2.11.1,<3.0.0",
]

[project.urls]
Homepage = "https://github.com/scholtz/Arc56Registry"
Repository = "https://github.com/scholtz/Arc56Registry"

[tool.hatch.build.targets.wheel]
packages = ["src/arc56_generated_bdutt_f32c3c6e"]
