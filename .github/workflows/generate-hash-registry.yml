name: Generate hash registry

on:
  schedule:
    - cron: "0 12 * * *" # daily at 12:00 UTC, after the .NET client generation run
  workflow_dispatch: {}
  push:
    paths:
      - "scripts/generate_hash_registry.py"

permissions:
  contents: write

concurrency:
  group: generate-hash-registry
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: the script pins each hash file to the commit that last touched its ARC-56 spec

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate approval-programs/, clear-programs/, and abi-signatures/
        run: python scripts/generate_hash_registry.py

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- approval-programs clear-programs abi-signatures && [ -z "$(git status --porcelain -- approval-programs clear-programs abi-signatures)" ]; then
            echo "No changes to approval-programs/, clear-programs/, or abi-signatures/"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add approval-programs clear-programs abi-signatures
          git commit -m "chore: update program hash registry"

          # generate-reputation.yml commits to approval-programs/clear-programs too (to
          # add reputation fields to the *.owners.json files this job writes), under a
          # different concurrency group, so it can genuinely race this job - retry with
          # a rebase onto whatever landed first instead of failing outright.
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt/5), re-syncing and retrying..."
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
            sleep $((attempt * 5))
          done
          echo "ERROR: failed to push after 5 attempts" >&2
          exit 1
