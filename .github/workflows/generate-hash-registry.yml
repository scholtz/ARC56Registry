name: Generate hash registry

on:
  schedule:
    - cron: "0 12 * * *" # daily at 12:00 UTC, after the .NET client generation run
  workflow_dispatch: {}
  push:
    paths:
      - "scripts/generate_hash_registry.py"

permissions:
  contents: write

concurrency:
  group: generate-hash-registry
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: the script pins each hash file to the commit that last touched its ARC-56 spec

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate approval-programs/, clear-programs/, and abi-signatures/
        run: python scripts/generate_hash_registry.py

      - name: Commit if changed
        id: commit
        run: |
          if git diff --quiet -- approval-programs clear-programs abi-signatures && [ -z "$(git status --porcelain -- approval-programs clear-programs abi-signatures)" ]; then
            echo "No changes to approval-programs/, clear-programs/, or abi-signatures/"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add approval-programs clear-programs abi-signatures
          git commit -m "chore: update program hash registry"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # generate-reputation.yml commits to approval-programs/clear-programs too (to add
      # reputation fields to the *.owners.json files this job writes), under a different
      # concurrency group, so it can genuinely race this job.
      - name: Push (retrying with rebase if generate-reputation.yml raced us)
        if: steps.commit.outputs.changed == 'true'
        uses: ./.github/actions/git-push-retry
